        <style>
            body {
                width: 90vw; /* 90% width of the viewport */
                width: calc(70% - 40px);
                margin: 1em auto;
                padding: 1em;
                border: 1px dotted black;
                font-size: calc(100% + 1vw);
                font-size: min(100%, 600px, 20rem); /* max() works the same */
                font-size: clamp(0.5rem, calc(100% + 1vw), calc(100% * 2)); /* min, val, max */
            }
        </style>
    </head>

    <body>
        <header>
            <h1>San Joaquin Valley Town Hall</h1>
        </header>
        <main>
            <p>Welcome to San Joaquin Valley Town Hall. We have some fascinating speakers for you this season!</p>
        </main>
