<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF=8">
        <title>Monday - CSS Lecture</title>
        <!--
        Author:  PoChin Cheng
        Date:    10/26/2026
        Flexbox example 1
        -->
        <style>  /* */
            main {
                display: flex;
                padding-top: 1em;
            }

            section {
                flex-basis: 65%;
            }

            aside {
                flex-basis: 35%;
                background-color: lightblue;
                border-radius: 1em;
                padding: 1em;
            }
        </style>
    </head>

    <body>
        <main>
            <section>
                <p>Welcome to San Joaquin Valley Town Hall.  We have some fascinating speakers for you this season!</p>
            </section>
            <aside>
                <p>The luncheon stars 15 minutes after the lecture ends.</p>
            </aside>

        </main>
    </body>
</html>
