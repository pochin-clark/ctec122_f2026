<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Flexbox Demo</title>
  <style>
    /* Flex Container */
    .flex-container {
      display: flex; /* Turns on Flexbox layout */
      gap: 10px;     /* Adds space between items */
    }

    /* Flex Items */
    .box {
      background-color: #2563eb;
      color: white;
      padding: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="flex-container">
    <div class="box">Item 1 sdkfjlsdjlsdj sldkjflsdjs ljsdjlsdjf lkfjdljd sdjfdsjlfsd sdfljdj slfjoosjflsjw osfdj odfjow osdffjfs.</div>
    <div class="box">Item 256</div>
    <div class="box">Item 3</div>
  </div>

</body>
</html>
